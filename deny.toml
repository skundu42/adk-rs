[advisories]
yanked = "warn"
ignore = [
    # `time` >=0.3.47 fixes RUSTSEC-2026-0009 but requires Rust 1.88.
    # Keep this ignored while the crate's MSRV and CI matrix remain on 1.85.
    "RUSTSEC-2026-0009",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[graph]
all-features = true
