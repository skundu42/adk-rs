[package]
name = "adk-rs-macros"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/skundu42/adk-rs"
homepage = "https://github.com/skundu42/adk-rs"
authors = ["Sandipan Kundu <sandipank.dev@gmail.com>"]
keywords = ["agent", "llm", "ai", "adk", "ai-sdk"]
categories = ["api-bindings", "asynchronous"]
description = "Procedural macros for adk-rs (the `#[tool]` attribute)."

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"
